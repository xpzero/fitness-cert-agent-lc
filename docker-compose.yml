services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: fitness
      POSTGRES_PASSWORD: fitness
      POSTGRES_DB: fitness
    ports:
      - "5433:5432"   # 本机 5432 已有 Postgres，映射到 5433
    volumes:
      - pgdata:/var/lib/postgresql/data
    shm_size: 512mb          # HNSW 索引构建需要（默认 64MB 不够）
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fitness"]
      interval: 5s
      timeout: 3s
      retries: 10

  langfuse:
    image: langfuse/langfuse:2
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://fitness:fitness@db:5432/langfuse
      NEXTAUTH_SECRET: dev-secret-change-me
      SALT: dev-salt-change-me
      NEXTAUTH_URL: http://localhost:3000
      TELEMETRY_ENABLED: "false"
    ports:
      - "3000:3000"

volumes:
  pgdata:
    # 卷名钉死：目录曾从 fitness-cert-agent 改名为 -lc，compose 自动命名随之改变
    # 起了空卷导致"数据丢失"。显式指回旧卷（9.4万 chunk 语料所在），
    # 以后目录改名不再受影响。空的 fitness-cert-agent-lc_pgdata 卷可手动删除。
    name: fitness-cert-agent_pgdata
